name: Audit 1 bootstrap schema contract

on:
  push:
    branches: ["remediation/audit-1-technical-architecture"]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[audit1-schema-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/audit-1-technical-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic migration/type contract
        run: node scripts/generate-schema-contract.mjs --write
      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          git add src/types/database-contract.generated.ts
          if git diff --cached --quiet; then
            echo "Schema contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate database schema contract [audit1-schema-bootstrap]"
          git push origin HEAD:remediation/audit-1-technical-architecture
