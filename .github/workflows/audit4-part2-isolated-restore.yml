name: Audit 4 Part 2 isolated restore proof

on:
  push:
    branches:
      - audit4-final-closure-part2-isolated-restore

permissions:
  contents: read

concurrency:
  group: audit4-final-closure-part2-isolated-restore
  cancel-in-progress: false

jobs:
  restore-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: db2d6395332e76d3b39c3eb7becdc549dd9cb88f
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify runner and CLI
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          npx -y supabase@2.117.0 --version

      - name: Prepare isolated recovery project with exactly nine migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-lab
          cd restore-lab
          npx -y supabase@2.117.0 init
          mkdir -p supabase/migrations
          cd ..
          cp supabase/migrations/20260924000100_tenant_leads.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000200_leads_created_by_index.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000300_owner_onboarding.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000400_lead_notes.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000500_quote_requests.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000600_lead_search.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000700_lead_customer_conversion.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000800_harden_conversion_rpc.sql restore-lab/supabase/migrations/
          cp supabase/migrations/20260924000900_crm_activity_history.sql restore-lab/supabase/migrations/
          test "$(find restore-lab/supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 9

      - name: Restore into fresh disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          cd restore-lab
          npx -y supabase@2.117.0 start

      - name: Verify restored migration count, zero-data state and forced RLS
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          test "$(psql "$DB_URL" -qAtc "select count(*) from supabase_migrations.schema_migrations;")" = "9"
          test "$(psql "$DB_URL" -qAtc "select current_setting('server_version_num')::int / 10000;")" = "17"

          test "$(psql "$DB_URL" -qAtc "
            select count(*)
            from pg_class c
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public'
              and c.relkind='r'
              and c.relname in ('business_memberships','businesses','crm_activities','customers','lead_notes','leads','quote_requests','services')
              and c.relrowsecurity
              and c.relforcerowsecurity;
          ")" = "8"

          test "$(psql "$DB_URL" -qAtc "
            select
              (select count(*) from public.business_memberships) +
              (select count(*) from public.businesses) +
              (select count(*) from public.crm_activities) +
              (select count(*) from public.customers) +
              (select count(*) from public.lead_notes) +
              (select count(*) from public.leads) +
              (select count(*) from public.quote_requests) +
              (select count(*) from public.services);
          ")" = "0"

          test "$(psql "$DB_URL" -qAtc "select count(*) from auth.users;")" = "0"
          test "$(psql "$DB_URL" -qAtc "select count(*) from storage.objects;")" = "0"
          test "$(psql "$DB_URL" -qAtc "select count(*) from storage.buckets;")" = "0"

      - name: Verify restored schema fingerprints against live Part 1 evidence
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          columns_md5="$(psql "$DB_URL" -qAtc "
            select md5(coalesce(string_agg(
              table_name||':'||column_name||':'||data_type||':'||is_nullable||':'||coalesce(column_default,''),
              E'\\n' order by table_name,ordinal_position),''))
            from information_schema.columns where table_schema='public';
          ")"

          policies_md5="$(psql "$DB_URL" -qAtc "
            select md5(coalesce(string_agg(
              schemaname||':'||tablename||':'||policyname||':'||cmd||':'||coalesce(qual,'')||':'||coalesce(with_check,''),
              E'\\n' order by schemaname,tablename,policyname),''))
            from pg_policies where schemaname='public';
          ")"

          indexes_md5="$(psql "$DB_URL" -qAtc "
            select md5(coalesce(string_agg(
              schemaname||':'||tablename||':'||indexname||':'||indexdef,
              E'\\n' order by schemaname,tablename,indexname),''))
            from pg_indexes where schemaname='public';
          ")"

          functions_md5="$(psql "$DB_URL" -qAtc "
            select md5(coalesce(string_agg(
              n.nspname||':'||p.proname||':'||pg_get_function_identity_arguments(p.oid)||':'||pg_get_functiondef(p.oid),
              E'\\n' order by n.nspname,p.proname,pg_get_function_identity_arguments(p.oid)),''))
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname in ('public','private');
          ")"

          triggers_md5="$(psql "$DB_URL" -qAtc "
            select md5(coalesce(string_agg(
              n.nspname||':'||c.relname||':'||t.tgname||':'||pg_get_triggerdef(t.oid,true),
              E'\\n' order by n.nspname,c.relname,t.tgname),''))
            from pg_trigger t
            join pg_class c on c.oid=t.tgrelid
            join pg_namespace n on n.oid=c.relnamespace
            where not t.tgisinternal and n.nspname='public';
          ")"

          test "$columns_md5" = "73767219aa6927e4699c36678ab40cb3"
          test "$indexes_md5" = "b89d41103eb9dc78dd6bdef640fe9a17"
          test "$policies_md5" = "3ed0e486d765748d82d36a4f0b66b91c"
          test "$triggers_md5" = "0fbb260aa24b146bf977f88eb38bbb52"
          test "$functions_md5" = "adcc0e0ac38ea17b787f7fb897ca439e"

          printf '%s\n'             "columns_md5=$columns_md5"             "indexes_md5=$indexes_md5"             "policies_md5=$policies_md5"             "triggers_md5=$triggers_md5"             "functions_md5=$functions_md5"             > restore-fingerprints.txt

      - name: Verify tenant isolation on restored database
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          insert into auth.users (id, email, raw_user_meta_data)
          values
            ('11111111-1111-4111-8111-111111111111', 'owner-a@restore.test', '{}'::jsonb),
            ('22222222-2222-4222-8222-222222222222', 'owner-b@restore.test', '{}'::jsonb);

          insert into public.businesses (id, name, slug)
          values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'Restore Tenant A', 'restore-tenant-a'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', 'Restore Tenant B', 'restore-tenant-b');

          insert into public.business_memberships (business_id, user_id, role, status)
          values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '11111111-1111-4111-8111-111111111111', 'owner', 'active'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '22222222-2222-4222-8222-222222222222', 'owner', 'active');

          set local role authenticated;
          set local "request.jwt.claim.sub" = '11111111-1111-4111-8111-111111111111';

          do $restore$
          declare
            visible_count integer;
            cross_count integer;
            own_update_count integer;
            cross_update_count integer;
          begin
            if auth.uid() <> '11111111-1111-4111-8111-111111111111'::uuid then
              raise exception 'auth.uid restoration test failed';
            end if;

            select count(*) into visible_count from public.businesses;
            if visible_count <> 1 then
              raise exception 'tenant visibility failed: expected 1 business, got %', visible_count;
            end if;

            select count(*) into cross_count
            from public.businesses
            where id = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid;
            if cross_count <> 0 then
              raise exception 'cross-tenant read was not denied';
            end if;

            with changed as (
              update public.businesses
              set name = 'Restore Tenant A Updated'
              where id = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid
              returning 1
            )
            select count(*) into own_update_count from changed;
            if own_update_count <> 1 then
              raise exception 'own-tenant owner update failed';
            end if;

            with changed as (
              update public.businesses
              set name = 'Cross Tenant Mutation'
              where id = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid
              returning 1
            )
            select count(*) into cross_update_count from changed;
            if cross_update_count <> 0 then
              raise exception 'cross-tenant update was not denied';
            end if;
          end
          $restore$;

          rollback;
          SQL

      - name: Record isolated restore proof
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          {
            echo "CODEEDGE BUSINESS OS — AUDIT 4 FINAL CLOSURE PART 2"
            echo "restore_environment=disposable local Supabase on GitHub-hosted runner"
            echo "source_main=db2d6395332e76d3b39c3eb7becdc549dd9cb88f"
            echo "restored_migrations=9"
            echo "restore_result=PASS"
            echo "forced_rls_tables=8"
            echo "tenant_isolation=PASS"
            echo "cross_tenant_read=DENIED"
            echo "cross_tenant_update=DENIED"
            echo "zero_data_state_after_restore=PASS"
            echo "hosted_database_mutated=false"
            echo "captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > audit4-part2-restore-proof.txt
          cat restore-fingerprints.txt >> audit4-part2-restore-proof.txt

      - name: Upload non-sensitive restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit4-part2-isolated-restore-proof
          path: |
            audit4-part2-restore-proof.txt
            restore-fingerprints.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop disposable Supabase
        if: always()
        shell: bash
        run: |
          cd restore-lab
          npx -y supabase@2.117.0 stop || true
