name: ERPNext disposable smoke test

on:
  push:
    branches:
      - feature/customers-erpnext-sync-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erpnext:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout CodeEdge
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Clone official Frappe Docker
        run: |
          git clone --depth 1 https://github.com/frappe/frappe_docker.git /tmp/frappe_docker

      - name: Start ERPNext disposable stack
        working-directory: /tmp/frappe_docker
        run: |
          docker compose -f pwd.yml up -d

      - name: Wait for ERPNext HTTP
        id: wait
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "ready=1" >> "$GITHUB_OUTPUT"
              echo "ERPNext HTTP responded."
              exit 0
            fi
            sleep 5
          done
          echo "ERPNext HTTP did not become ready."
          exit 1

      - name: Wait for ERPNext site installation
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose -f pwd.yml ps -q create-site)"
          test -n "$container_id"

          for i in $(seq 1 120); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$container_id")"
            echo "create-site status=$status exit=$exit_code"

            if [ "$status" = "exited" ]; then
              if [ "$exit_code" = "0" ]; then
                echo "ERPNext site installation finished."
                exit 0
              fi
              docker compose -f pwd.yml logs create-site --tail=200
              exit 1
            fi
            sleep 5
          done

          docker compose -f pwd.yml logs create-site --tail=200
          exit 1

      - name: Login and generate temporary API credentials
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -c /tmp/erpnext-cookie.txt             -X POST http://127.0.0.1:8080/api/method/login             --data-urlencode 'usr=Administrator'             --data-urlencode 'pwd=admin'             >/tmp/login.json

          curl -fsS -b /tmp/erpnext-cookie.txt             -X POST http://127.0.0.1:8080/api/method/frappe.core.doctype.user.user.generate_keys             --data-urlencode 'user=Administrator'             >/tmp/keys.json

          API_KEY="$(jq -r '.message.api_key' /tmp/keys.json)"
          API_SECRET="$(jq -r '.message.api_secret' /tmp/keys.json)"

          test -n "$API_KEY"
          test "$API_KEY" != "null"
          test -n "$API_SECRET"
          test "$API_SECRET" != "null"

          echo "::add-mask::$API_KEY"
          echo "::add-mask::$API_SECRET"

          {
            echo "ERPNEXT_BASE_URL=http://127.0.0.1:8080"
            echo "ERPNEXT_API_KEY=$API_KEY"
            echo "ERPNEXT_API_SECRET=$API_SECRET"
          } >> "$GITHUB_ENV"

      - name: Verify temporary API token
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if result="$(curl -fsS               -H "Authorization: token $ERPNEXT_API_KEY:$ERPNEXT_API_SECRET"               http://127.0.0.1:8080/api/method/frappe.auth.get_logged_user 2>/tmp/token.err)"; then
              echo "$result" | jq -e '.message == "Administrator"'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/token.err || true
          exit 1

      - name: Create one ERPNext customer
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/customer-group-root.json <<'JSON'
          {
            "customer_group_name": "All Customer Groups",
            "is_group": 1
          }
          JSON

          cat >/tmp/customer-group-leaf.json <<'JSON'
          {
            "customer_group_name": "CodeEdge Demo Customers",
            "parent_customer_group": "All Customer Groups",
            "is_group": 0
          }
          JSON

          cat >/tmp/territory-root.json <<'JSON'
          {
            "territory_name": "All Territories",
            "is_group": 1
          }
          JSON

          cat >/tmp/territory-leaf.json <<'JSON'
          {
            "territory_name": "CodeEdge Demo Territory",
            "parent_territory": "All Territories",
            "is_group": 0
          }
          JSON

          curl -fsS -b /tmp/erpnext-cookie.txt -H "Content-Type: application/json"             -X POST --data-binary @/tmp/customer-group-root.json             http://127.0.0.1:8080/api/resource/Customer%20Group             >/tmp/customer-group-root-created.json

          curl -fsS -b /tmp/erpnext-cookie.txt -H "Content-Type: application/json"             -X POST --data-binary @/tmp/customer-group-leaf.json             http://127.0.0.1:8080/api/resource/Customer%20Group             >/tmp/customer-group-leaf-created.json

          curl -fsS -b /tmp/erpnext-cookie.txt -H "Content-Type: application/json"             -X POST --data-binary @/tmp/territory-root.json             http://127.0.0.1:8080/api/resource/Territory             >/tmp/territory-root-created.json

          curl -fsS -b /tmp/erpnext-cookie.txt -H "Content-Type: application/json"             -X POST --data-binary @/tmp/territory-leaf.json             http://127.0.0.1:8080/api/resource/Territory             >/tmp/territory-leaf-created.json

          cat >/tmp/customer.json <<'JSON'
          {
            "customer_name": "CodeEdge Sync Test Customer",
            "customer_type": "Individual",
            "customer_group": "CodeEdge Demo Customers",
            "territory": "CodeEdge Demo Territory"
          }
          JSON

          curl -fsS             -b /tmp/erpnext-cookie.txt             -H "Content-Type: application/json"             -X POST             --data-binary @/tmp/customer.json             http://127.0.0.1:8080/api/resource/Customer             | tee /tmp/created-customer.json

          jq -e '.data.customer_name == "CodeEdge Sync Test Customer"' /tmp/created-customer.json

      - name: Verify ERPNext customer exists
        run: |
          curl -fsS --get             -b /tmp/erpnext-cookie.txt             --data-urlencode 'fields=["name","customer_name","customer_group","territory"]'             --data-urlencode 'filters=[["customer_name","=","CodeEdge Sync Test Customer"]]'             http://127.0.0.1:8080/api/resource/Customer             | tee /tmp/erpnext-customer.json

          jq -e '.data | length == 1' /tmp/erpnext-customer.json
          jq -e '.data[0].customer_name == "CodeEdge Sync Test Customer"' /tmp/erpnext-customer.json

      - name: Install CodeEdge dependencies
        run: npm install

      - name: Build CodeEdge
        run: npm run build

      - name: Start CodeEdge
        shell: bash
        run: |
          nohup npm start >/tmp/codeedge.log 2>&1 &
          echo $! >/tmp/codeedge.pid

          for i in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/codeedge.log || true
          exit 1

      - name: Verify CodeEdge ERPNext connection
        run: |
          curl -fsS http://127.0.0.1:3000/api/integrations/erpnext/status | tee /tmp/status.json
          jq -e '.connected == true and .authenticatedUser == "Administrator"' /tmp/status.json

      - name: Verify customer reaches CodeEdge adapter
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/integrations/erpnext/customers?limit=50 >/tmp/codeedge-customers.json 2>/dev/null; then
              if jq -e '.data | any(.customer_name == "CodeEdge Sync Test Customer")' /tmp/codeedge-customers.json >/dev/null; then
                cat /tmp/codeedge-customers.json
                exit 0
              fi
            fi
            sleep 2
          done

          cat /tmp/codeedge-customers.json || true
          exit 1

      - name: Verify customer renders on Customers page
        run: |
          curl -fsS http://127.0.0.1:3000/dashboard/buy-from-me/customers >/tmp/customers-page.html
          grep -F "CodeEdge Sync Test Customer" /tmp/customers-page.html
          grep -F "ERPNext live" /tmp/customers-page.html

      - name: Diagnostics
        if: always()
        working-directory: /tmp/frappe_docker
        run: |
          echo "===== CONTAINERS ====="
          docker compose -f pwd.yml ps || true
          echo "===== CREATE-SITE ====="
          docker compose -f pwd.yml logs create-site --tail=120 || true
          echo "===== BACKEND ====="
          docker compose -f pwd.yml logs backend --tail=120 || true
          echo "===== FRONTEND ====="
          docker compose -f pwd.yml logs frontend --tail=120 || true

      - name: Shut down disposable ERPNext
        if: always()
        working-directory: /tmp/frappe_docker
        run: |
          docker compose -f pwd.yml down -v || true
