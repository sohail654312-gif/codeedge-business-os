name: ERPNext disposable Finance Engine smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/erpnext-smoke.yml"
      - "src/server/finance/**"
      - "src/integrations/erpnext/**"
      - "src/app/api/integrations/erpnext/**"
      - "tests/integration/erpnext-finance-smoke.test.ts"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  erpnext:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Codeedge
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Codeedge dependencies deterministically
        run: npm ci

      - name: Clone official Frappe Docker
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git /tmp/frappe_docker

      - name: Start disposable ERPNext
        working-directory: /tmp/frappe_docker
        run: docker compose -f pwd.yml up -d

      - name: Wait for ERPNext site installation
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose -f pwd.yml ps -q create-site)"
          test -n "$container_id"
          for i in $(seq 1 120); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$container_id")"
            if [ "$status" = "exited" ]; then
              test "$exit_code" = "0"
              exit 0
            fi
            sleep 5
          done
          docker compose -f pwd.yml logs create-site --tail=200
          exit 1

      - name: Wait for ERPNext HTTP
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Create deterministic disposable ERPNext fixture
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail

          CUSTOMER_NAME="$(docker compose -f pwd.yml exec -T backend             bench --site frontend execute             "frappe.get_doc({'doctype':'Customer','customer_name':'Codeedge Finance Smoke Customer','customer_type':'Individual'}).insert(ignore_permissions=True,ignore_mandatory=True,ignore_links=True).name")"

          test -n "$CUSTOMER_NAME"

      - name: Generate committed disposable ERPNext API credential
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail

          KEYS_JSON="$(docker compose -f pwd.yml exec -T backend             bench --site frontend execute             "frappe.set_user('Administrator') or frappe.get_attr('frappe.core.doctype.user.user.generate_keys')('Administrator')")"

          API_KEY="$(printf '%s' "$KEYS_JSON" | jq -er '.api_key')"
          API_SECRET="$(printf '%s' "$KEYS_JSON" | jq -er '.api_secret')"

          echo "::add-mask::$API_KEY"
          echo "::add-mask::$API_SECRET"

          BUSINESS_ID="20000000-0000-4000-8000-00000000e501"
          CREDENTIALS="$(jq -cn             --arg businessId "$BUSINESS_ID"             --arg apiKey "$API_KEY"             --arg apiSecret "$API_SECRET"             '{ci_erpnext:{businessId:$businessId,baseUrl:"http://127.0.0.1:8080",apiKey:$apiKey,apiSecret:$apiSecret}}')"

          {
            echo "ERP_SMOKE_API_KEY=$API_KEY"
            echo "ERP_SMOKE_API_SECRET=$API_SECRET"
            echo "CODEEDGE_ERPNEXT_SMOKE=1"
            echo "CODEEDGE_SMOKE_BUSINESS_ID=$BUSINESS_ID"
            echo "FINANCE_ERPNEXT_CREDENTIALS_JSON=$CREDENTIALS"
          } >> "$GITHUB_ENV"

      - name: Activate disposable ERPNext credential
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f pwd.yml exec -T backend bench --site frontend clear-cache
          docker compose -f pwd.yml restart backend frontend

          for i in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f pwd.yml logs backend --tail=120
          exit 1

      - name: Verify disposable ERPNext token authentication
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: token $ERP_SMOKE_API_KEY:$ERP_SMOKE_API_SECRET"

          for i in $(seq 1 20); do
            http_code="$(curl -sS               -o /tmp/erpnext-auth.json               -w '%{http_code}'               -H "$AUTH_HEADER"               http://127.0.0.1:8080/api/method/frappe.auth.get_logged_user || true)"

            if [ "$http_code" = "200" ] && jq -e '.message == "Administrator"' /tmp/erpnext-auth.json >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "ERPNext token authentication did not become usable." >&2
          jq -c '{message,exc_type,exception}' /tmp/erpnext-auth.json 2>/dev/null || true
          exit 1

      - name: Exercise current Codeedge Finance -> ERPNext boundary
        run: npx vitest run tests/integration/erpnext-finance-smoke.test.ts

      - name: Record coverage boundary
        run: |
          echo "This workflow uses a disposable local ERPNext instance only." >> "$GITHUB_STEP_SUMMARY"
          echo "It validates current Finance credential mapping, Finance Engine metadata/capabilities, ERPNext adapter reads, and the current status response mapper." >> "$GITHUB_STEP_SUMMARY"
          echo "Application sign-in/RLS/tenant wiring is covered by the main security and critical-path suites; this provider smoke does not impersonate an unauthenticated app request." >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: always()
        working-directory: /tmp/frappe_docker
        run: |
          docker compose -f pwd.yml ps || true
          docker compose -f pwd.yml logs create-site --tail=120 || true
          docker compose -f pwd.yml logs backend --tail=120 || true

      - name: Shut down disposable ERPNext
        if: always()
        working-directory: /tmp/frappe_docker
        run: docker compose -f pwd.yml down -v || true
