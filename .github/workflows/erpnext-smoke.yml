name: ERPNext disposable Finance Engine smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/erpnext-smoke.yml"
      - "src/server/finance/**"
      - "src/integrations/erpnext/**"
      - "src/app/api/integrations/erpnext/**"
      - "tests/integration/erpnext-finance-smoke.test.ts"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  erpnext:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Codeedge
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Codeedge dependencies deterministically
        run: npm ci

      - name: Clone official Frappe Docker
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git /tmp/frappe_docker

      - name: Start disposable ERPNext
        working-directory: /tmp/frappe_docker
        run: docker compose -f pwd.yml up -d

      - name: Wait for ERPNext site installation
        working-directory: /tmp/frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose -f pwd.yml ps -q create-site)"
          test -n "$container_id"
          for i in $(seq 1 120); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$container_id")"
            if [ "$status" = "exited" ]; then
              test "$exit_code" = "0"
              exit 0
            fi
            sleep 5
          done
          docker compose -f pwd.yml logs create-site --tail=200
          exit 1

      - name: Wait for ERPNext HTTP
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Generate disposable ERPNext credential and fixture
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body -sS             -c /tmp/erpnext-cookie.txt             -X POST http://127.0.0.1:8080/api/method/login             --data-urlencode 'usr=Administrator'             --data-urlencode 'pwd=admin'             >/tmp/login.json
          jq -e '.message == "Logged In"' /tmp/login.json >/dev/null

          curl --fail-with-body -sS             -b /tmp/erpnext-cookie.txt             -X POST http://127.0.0.1:8080/api/method/frappe.core.doctype.user.user.generate_keys             --data-urlencode 'user=Administrator'             >/tmp/keys.json

          API_KEY="$(jq -er '.message.api_key' /tmp/keys.json)"
          API_SECRET="$(jq -er '.message.api_secret' /tmp/keys.json)"
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$API_SECRET"

          AUTH_HEADER="Authorization: token $API_KEY:$API_SECRET"

          curl --fail-with-body -sS             -H "$AUTH_HEADER"             http://127.0.0.1:8080/api/method/frappe.auth.get_logged_user             | jq -e '.message == "Administrator"' >/dev/null

          CUSTOMER_GROUP="Codeedge Finance Smoke Customers"
          CUSTOMER_GROUP_COUNT="$(curl --fail-with-body -sS             -H "$AUTH_HEADER"             --get http://127.0.0.1:8080/api/resource/Customer%20Group             --data-urlencode 'fields=["name"]'             --data-urlencode 'filters=[["name","=","Codeedge Finance Smoke Customers"],["is_group","=",0]]'             --data-urlencode 'limit_page_length=1'             | jq -er '.data | length')"

          if [ "$CUSTOMER_GROUP_COUNT" = "0" ]; then
            curl --fail-with-body -sS               -H "$AUTH_HEADER"               -H "Content-Type: application/json"               -X POST               --data '{"customer_group_name":"Codeedge Finance Smoke Customers","parent_customer_group":"All Customer Groups","is_group":0}'               http://127.0.0.1:8080/api/resource/Customer%20Group               >/tmp/customer-group-created.json
            jq -e '.data.name == "Codeedge Finance Smoke Customers"' /tmp/customer-group-created.json >/dev/null
          fi

          TERRITORY="Codeedge Finance Smoke Territory"
          TERRITORY_COUNT="$(curl --fail-with-body -sS             -H "$AUTH_HEADER"             --get http://127.0.0.1:8080/api/resource/Territory             --data-urlencode 'fields=["name"]'             --data-urlencode 'filters=[["name","=","Codeedge Finance Smoke Territory"],["is_group","=",0]]'             --data-urlencode 'limit_page_length=1'             | jq -er '.data | length')"

          if [ "$TERRITORY_COUNT" = "0" ]; then
            curl --fail-with-body -sS               -H "$AUTH_HEADER"               -H "Content-Type: application/json"               -X POST               --data '{"territory_name":"Codeedge Finance Smoke Territory","parent_territory":"All Territories","is_group":0}'               http://127.0.0.1:8080/api/resource/Territory               >/tmp/territory-created.json
            jq -e '.data.name == "Codeedge Finance Smoke Territory"' /tmp/territory-created.json >/dev/null
          fi

          CUSTOMER_JSON="$(jq -cn             --arg group "$CUSTOMER_GROUP"             --arg territory "$TERRITORY"             '{customer_name:"Codeedge Finance Smoke Customer",customer_type:"Individual",customer_group:$group,territory:$territory}')"

          curl --fail-with-body -sS             -H "$AUTH_HEADER"             -H "Content-Type: application/json"             -X POST             --data "$CUSTOMER_JSON"             http://127.0.0.1:8080/api/resource/Customer             >/tmp/customer-created.json
          jq -e '.data.customer_name == "Codeedge Finance Smoke Customer"' /tmp/customer-created.json >/dev/null

          BUSINESS_ID="20000000-0000-4000-8000-00000000e501"
          CREDENTIALS="$(jq -cn             --arg businessId "$BUSINESS_ID"             --arg apiKey "$API_KEY"             --arg apiSecret "$API_SECRET"             --arg customerGroup "$CUSTOMER_GROUP"             --arg territory "$TERRITORY"             '{ci_erpnext:{businessId:$businessId,baseUrl:"http://127.0.0.1:8080",apiKey:$apiKey,apiSecret:$apiSecret,customerGroup:$customerGroup,territory:$territory}}')"
          {
            echo "CODEEDGE_ERPNEXT_SMOKE=1"
            echo "CODEEDGE_SMOKE_BUSINESS_ID=$BUSINESS_ID"
            echo "FINANCE_ERPNEXT_CREDENTIALS_JSON=$CREDENTIALS"
          } >> "$GITHUB_ENV"

      - name: Exercise current Codeedge Finance -> ERPNext boundary
        run: npx vitest run tests/integration/erpnext-finance-smoke.test.ts

      - name: Record coverage boundary
        run: |
          echo "This workflow uses a disposable local ERPNext instance only." >> "$GITHUB_STEP_SUMMARY"
          echo "It validates current Finance credential mapping, Finance Engine metadata/capabilities, ERPNext adapter reads, and the current status response mapper." >> "$GITHUB_STEP_SUMMARY"
          echo "Application sign-in/RLS/tenant wiring is covered by the main security and critical-path suites; this provider smoke does not impersonate an unauthenticated app request." >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: always()
        working-directory: /tmp/frappe_docker
        run: |
          docker compose -f pwd.yml ps || true
          docker compose -f pwd.yml logs create-site --tail=120 || true
          docker compose -f pwd.yml logs backend --tail=120 || true

      - name: Shut down disposable ERPNext
        if: always()
        working-directory: /tmp/frappe_docker
        run: docker compose -f pwd.yml down -v || true
