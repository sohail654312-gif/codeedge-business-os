name: Audit 4 Part 1 recovery bundle

on:
  push:
    branches:
      - audit4-final-closure-part1-backup

permissions:
  contents: read

concurrency:
  group: audit4-final-closure-part1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 4fdbd97d5e0fa60d94c2589dacaaf67146da3401
          persist-credentials: false

      - name: Build recoverable current-hosted-state bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/migrations

          cp supabase/migrations/20260924000100_tenant_leads.sql recovery/migrations/
          cp supabase/migrations/20260924000200_leads_created_by_index.sql recovery/migrations/
          cp supabase/migrations/20260924000300_owner_onboarding.sql recovery/migrations/
          cp supabase/migrations/20260924000400_lead_notes.sql recovery/migrations/
          cp supabase/migrations/20260924000500_quote_requests.sql recovery/migrations/
          cp supabase/migrations/20260924000600_lead_search.sql recovery/migrations/
          cp supabase/migrations/20260924000700_lead_customer_conversion.sql recovery/migrations/
          cp supabase/migrations/20260924000800_harden_conversion_rpc.sql recovery/migrations/
          cp supabase/migrations/20260924000900_crm_activity_history.sql recovery/migrations/

          cat > recovery/LIVE-EVIDENCE.json <<'JSON'
          {
            "backup_kind": "schema-state recovery bundle",
            "source_project": "CodeEdge Business OS",
            "source_project_ref": "ljniurodhvbvpcztwlnh",
            "source_region": "ap-south-1",
            "source_plan": "free",
            "source_status": "ACTIVE_HEALTHY",
            "captured_at_utc": "2026-09-27T12:07:40.815443+00:00",
            "repository_main_sha": "4fdbd97d5e0fa60d94c2589dacaaf67146da3401",
            "restore_attempted": false,
            "data_state": {
              "public_application_tables_all_zero_rows": true,
              "auth_users": 0,
              "storage_objects": 0,
              "storage_buckets": 0
            },
            "fingerprints": {
              "columns_md5": "73767219aa6927e4699c36678ab40cb3",
              "indexes_md5": "b89d41103eb9dc78dd6bdef640fe9a17",
              "policies_md5": "3ed0e486d765748d82d36a4f0b66b91c",
              "triggers_md5": "0fbb260aa24b146bf977f88eb38bbb52",
              "functions_md5": "adcc0e0ac38ea17b787f7fb897ca439e"
            },
            "hosted_migrations": [
              {
                "version": "20260924130630",
                "name": "tenant_leads"
              },
              {
                "version": "20260924130830",
                "name": "leads_created_by_index"
              },
              {
                "version": "20260924132707",
                "name": "owner_onboarding"
              },
              {
                "version": "20260924154125",
                "name": "lead_notes"
              },
              {
                "version": "20260924160107",
                "name": "quote_requests"
              },
              {
                "version": "20260924161607",
                "name": "lead_search"
              },
              {
                "version": "20260924163123",
                "name": "lead_customer_conversion"
              },
              {
                "version": "20260924163230",
                "name": "harden_conversion_rpc"
              },
              {
                "version": "20260924165357",
                "name": "crm_activity_history"
              }
            ],
            "rls_forced_tables": [
              "business_memberships",
              "businesses",
              "crm_activities",
              "customers",
              "lead_notes",
              "leads",
              "quote_requests",
              "services"
            ],
            "installed_extensions": [
              {
                "name": "pg_stat_statements",
                "version": "1.11"
              },
              {
                "name": "pgcrypto",
                "version": "1.3"
              },
              {
                "name": "plpgsql",
                "version": "1.0"
              },
              {
                "name": "supabase_vault",
                "version": "0.3.1"
              },
              {
                "name": "uuid-ossp",
                "version": "1.1"
              }
            ]
          }
          JSON

          cat > recovery/RESTORE-NOTES.md <<'EOF'
          # Audit 4 Part 1 recovery bundle

          This bundle captures the recoverable application-database state of the
          active CodeEdge Business OS Supabase project at the evidence timestamp.

          At capture time:
          - all eight public application tables contained zero rows;
          - auth.users contained zero rows;
          - storage.objects and storage.buckets contained zero rows;
          - the hosted project had exactly nine application migrations applied;
          - RLS was enabled and forced on every public application table.

          Recovery method for Part 2:
          1. Start from a new isolated Supabase project.
          2. Apply the nine SQL migration files in lexical order.
          3. Do not create customer/auth/storage rows because the source snapshot has none.
          4. Recompute table/RLS/schema fingerprints and compare with LIVE-EVIDENCE.json.
          5. Record the restore proof separately.

          This Part 1 workflow performs no restore and no hosted database mutation.

          The preferred future backup mechanism remains Supabase CLI roles/schema/data
          dumps once MIGRATION_DATABASE_URL is configured in the protected environment.
          EOF

          (cd recovery && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -C recovery -czf codeedge-business-os-audit4-part1-recovery.tar.gz .
          sha256sum codeedge-business-os-audit4-part1-recovery.tar.gz > RECOVERY-BUNDLE-SHA256.txt

      - name: Upload recovery bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit4-part1-recovery-bundle
          path: |
            codeedge-business-os-audit4-part1-recovery.tar.gz
            RECOVERY-BUNDLE-SHA256.txt
          if-no-files-found: error
          retention-days: 7
