          sha256sum codeedge-business-os-audit4-part1-backup.cms > ENCRYPTED-SHA256SUMS.txt
          rm -rf audit4-backup codeedge-business-os-audit4-part1-backup.tar.gz backup-cert.pem

      - name: Upload encrypted backup evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit4-part1-encrypted-backup
          path: |
            codeedge-business-os-audit4-part1-backup.cms
            ENCRYPTED-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
