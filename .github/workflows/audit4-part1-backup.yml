name: Audit 4 Part 1 encrypted backup evidence

on:
  push:
    branches:
      - audit4-final-closure-part1-backup

permissions:
  contents: read

concurrency:
  group: audit4-final-closure-part1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: audit4-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 4fdbd97d5e0fa60d94c2589dacaaf67146da3401
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify backup target and runner prerequisites
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$MIGRATION_DATABASE_URL"
          case "$MIGRATION_DATABASE_URL" in
            *ljniurodhvbvpcztwlnh*) ;;
            *) echo "Refusing backup: MIGRATION_DATABASE_URL does not target the verified CodeEdge Business OS project ref." >&2; exit 1 ;;
          esac
          docker info >/dev/null
          npx -y supabase@2.117.0 --version

      - name: Create Supabase logical backup
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p audit4-backup
          npx -y supabase@2.117.0 db dump --db-url "$MIGRATION_DATABASE_URL" -f audit4-backup/roles.sql --role-only
          npx -y supabase@2.117.0 db dump --db-url "$MIGRATION_DATABASE_URL" -f audit4-backup/schema.sql
          npx -y supabase@2.117.0 db dump --db-url "$MIGRATION_DATABASE_URL" -f audit4-backup/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Validate and fingerprint backup
        shell: bash
        run: |
          set -euo pipefail
          test -s audit4-backup/roles.sql
          test -s audit4-backup/schema.sql
          test -s audit4-backup/data.sql
          grep -q "CREATE TABLE" audit4-backup/schema.sql
          {
            echo "CODEEDGE BUSINESS OS — AUDIT 4 PART 1 BACKUP"
            echo "source_project=CodeEdge Business OS"
            echo "source_project_ref=ljniurodhvbvpcztwlnh"
            echo "source_region=ap-south-1"
            echo "source_plan=free"
            echo "repository_main_sha=4fdbd97d5e0fa60d94c2589dacaaf67146da3401"
            echo "supabase_cli=2.117.0"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "restore_attempted=false"
          } > audit4-backup/MANIFEST.txt
          (cd audit4-backup && sha256sum roles.sql schema.sql data.sql > SHA256SUMS.txt)
          tar -C audit4-backup -czf codeedge-business-os-audit4-part1-backup.tar.gz roles.sql schema.sql data.sql MANIFEST.txt SHA256SUMS.txt

      - name: Encrypt backup before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          cat > backup-cert.pem <<'CERT'
