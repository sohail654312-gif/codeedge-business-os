name: Audit 1 bootstrap lockfile

on:
  push:
    branches: ["remediation/audit-1-technical-architecture"]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[audit1-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/audit-1-technical-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate npm lockfile [audit1-bootstrap]"
          git push origin HEAD:remediation/audit-1-technical-architecture
