name: Audit 4 operational verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-4-operational-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: audit4-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify repository schema contract
        run: npm run schema:check
      - name: Verify hosted migration parity
        run: npm run schema:hosted-parity
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Verify deployed readiness and Automation health
        run: node scripts/audit4-ops-verify.mjs
        env:
          AUDIT4_BASE_URL: ${{ secrets.AUDIT4_BASE_URL }}
          AUTOMATION_RUNNER_SECRET: ${{ secrets.AUTOMATION_RUNNER_SECRET }}
