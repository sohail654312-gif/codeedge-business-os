name: CI

on:
  push:
    branches: ["main", "feature/**", "remediation/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify migration-to-TypeScript schema contract
        run: npm run schema:check
      - name: Prove schema drift gate rejects a mismatch
        run: npm run schema:prove-drift
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
